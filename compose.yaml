services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_document_manager
      VECTOR_DB_URL: http://vector-db:6333
    ports:
      - "8000:8000"
    volumes:
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      - db
      - vector-db

  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      # Chỉ bind localhost để tool local truy cập, không mở ra mạng LAN
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  vector-db:
    image: qdrant/qdrant
    volumes:
      - vector-data:/qdrant/storage

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-PgAdmin@2026!}
      # Không dùng master password: server được đăng ký sẵn, khi mở chỉ cần nhập
      # POSTGRES_PASSWORD một lần và tick "Save Password" là nhớ mãi
      PGADMIN_MASTER_PASSWORD_REQUIRED: "false"
    ports:
      # Chỉ bind localhost để tránh lộ tool quản trị DB ra mạng LAN
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  db-data:
  vector-data:
  pgadmin-data:
